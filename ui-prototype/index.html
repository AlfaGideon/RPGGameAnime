<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Эхо Астры — прототип интерфейса</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="device-frame">
    <div class="app-surface" id="app">
      <header class="topbar" id="topbar"></header>
      <main class="screen" id="screen" aria-live="polite"></main>
      <nav class="bottom-nav" id="bottom-nav" aria-label="Основная навигация"></nav>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="modal-backdrop" id="modal-backdrop" hidden>
        <section class="modal-card" id="modal-card" role="dialog" aria-modal="true"></section>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
