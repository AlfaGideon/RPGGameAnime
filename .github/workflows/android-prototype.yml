name: Build Android UI prototype APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'android-prototype/**'
      - 'ui-prototype/**'
      - '.github/workflows/android-prototype.yml'
  pull_request:
    paths:
      - 'android-prototype/**'
      - 'ui-prototype/**'
      - '.github/workflows/android-prototype.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        working-directory: android-prototype
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Astra-UI-Prototype-debug-APK
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
