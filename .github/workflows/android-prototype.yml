name: Build Android UI prototype APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'android-prototype/**'
      - 'ui-prototype/**'
      - '.github/workflows/android-prototype.yml'
  pull_request:
    paths:
      - 'android-prototype/**'
      - 'ui-prototype/**'
      - '.github/workflows/android-prototype.yml'
  workflow_dispatch:
    inputs:
      commit_apk:
        description: Also save the built APK under apk-output/ on the current Arena branch
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        working-directory: android-prototype
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature and bundled UI
        run: |
          apk="android-prototype/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "^package: name='com.rpggameanime.prototype'"
          unzip -l "$apk" | grep -q 'assets/index.html'
          unzip -l "$apk" | grep -q 'assets/styles.css'
          unzip -l "$apk" | grep -q 'assets/app.js'

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Astra-UI-Prototype-debug-APK
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Save APK on the Arena branch
        if: github.event_name == 'workflow_dispatch' && inputs.commit_apk == true && github.ref == 'refs/heads/arena/445aa2c5-rpggameanime'
        run: |
          mkdir -p apk-output
          cp android-prototype/app/build/outputs/apk/debug/app-debug.apk apk-output/Echo-Astra-UI-Prototype.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-output/Echo-Astra-UI-Prototype.apk
          if git diff --cached --quiet; then
            echo "The checked-in APK is already up to date."
          else
            git commit -m "Add installable Android UI prototype APK"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
