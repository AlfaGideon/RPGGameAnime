name: Build Android UI prototype APK

on:
  push:
    branches:
      - main
      - 'arena/**'
    paths:
      - 'android-prototype/**'
      - 'ui-prototype/**'
      - '.github/workflows/android-prototype.yml'
  pull_request:
    paths:
      - 'android-prototype/**'
      - 'ui-prototype/**'
      - '.github/workflows/android-prototype.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
      ANDROID_SIGNING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Test combat engine and JavaScript syntax
        run: |
          node --check ui-prototype/app.js
          node --check ui-prototype/movement-engine.js
          node --check ui-prototype/combat-engine.js
          node --test tests/*.test.js

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Assemble debug APK
        working-directory: android-prototype
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK signature and bundled UI
        run: |
          set -euo pipefail
          apk="android-prototype/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          if [ -n "${ANDROID_SIGNING_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_SIGNING_KEYSTORE_PASSWORD:-}" ]; then
            expected_fingerprint="$(keytool -list -v -storetype PKCS12 -keystore android-prototype/app/build/signing/echo-astra-release.p12 -storepass "$ANDROID_SIGNING_KEYSTORE_PASSWORD" -alias echo-astra-release | awk -F': ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            actual_fingerprint="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test -n "$expected_fingerprint" && test "$expected_fingerprint" = "$actual_fingerprint" || { echo 'APK signature does not match the configured persistent signing key.' >&2; exit 1; }
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep -q "^package: name='com.rpggameanime.prototype'"
          unzip -l "$apk" | grep -q 'assets/index.html'
          unzip -l "$apk" | grep -q 'assets/styles.css'
          unzip -l "$apk" | grep -q 'assets/movement-engine.js'
          unzip -l "$apk" | grep -q 'assets/combat-engine.js'
          unzip -l "$apk" | grep -q 'assets/app.js'
          unzip -l "$apk" | grep -q 'assets/assets/echo-astra-logo.png'
          for class_art in guardian duelist ranger arcanist warden; do
            unzip -l "$apk" | grep -q "assets/assets/classes/$class_art.png"
            unzip -l "$apk" | grep -q "assets/assets/cutouts/classes/$class_art.png"
          done
          for npc in iara-kest vesta-ran nir toren-val meyra-sol elna-rut kora-vei; do
            unzip -l "$apk" | grep -q "assets/assets/npcs/$npc.png"
            unzip -l "$apk" | grep -q "assets/assets/cutouts/npcs/$npc.png"
          done
          unzip -l "$apk" | grep -q 'assets/assets/locations/lior-city.png'
          for profession in blacksmith farmer herbalist miner carpenter tanner builder; do
            unzip -l "$apk" | grep -q "assets/assets/icons/profession-$profession.svg"
          done

      - name: Warn when stable APK signing is not configured
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/d3628144-rpggameanime' && (env.ANDROID_SIGNING_KEYSTORE_BASE64 == '' || env.ANDROID_SIGNING_KEYSTORE_PASSWORD == '')
        run: echo 'Stable APK signing secrets are missing; this debug build will not be published as a versioned release.'

      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Astra-UI-Prototype-debug-APK
          path: android-prototype/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Save APK and build manifest on the Arena branch
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/arena/d3628144-rpggameanime' && env.ANDROID_SIGNING_KEYSTORE_BASE64 != '' && env.ANDROID_SIGNING_KEYSTORE_PASSWORD != ''
        env:
          VERSION_NAME: 0.2.${{ github.run_number }}
        run: |
          set -euo pipefail
          apk="android-prototype/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p apk-output
          cp "$apk" apk-output/Echo-Astra-UI-Prototype.apk
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          apk_sha256="$(sha256sum apk-output/Echo-Astra-UI-Prototype.apk | awk '{print $1}')"
          tag_name="v${VERSION_NAME}"
          apk_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag_name}/Echo-Astra-UI-Prototype.apk"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag_name}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export VERSION_CODE="$version_code" APK_SHA256="$apk_sha256" TAG_NAME="$tag_name" APK_URL="$apk_url" RELEASE_URL="$release_url" BUILT_AT="$built_at"
          python3 - <<'PY'
          import json, os
          manifest = {
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "tagName": os.environ["TAG_NAME"],
              "apkUrl": os.environ["APK_URL"],
              "htmlUrl": os.environ["RELEASE_URL"],
              "buildSha": os.environ["GITHUB_SHA"],
              "sha256": os.environ["APK_SHA256"],
              "builtAt": os.environ["BUILT_AT"],
              "workflowRun": os.environ["GITHUB_RUN_ID"]
          }
          with open("apk-output/version.json", "w", encoding="utf-8") as file:
              json.dump(manifest, file, indent=2)
              file.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-output/Echo-Astra-UI-Prototype.apk apk-output/version.json
          if git diff --cached --quiet; then
            echo "The checked-in APK and build manifest are already up to date."
          else
            git commit -m "Publish Android prototype build ${VERSION_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish a versioned GitHub release for existing clients
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/arena/d3628144-rpggameanime' && env.ANDROID_SIGNING_KEYSTORE_BASE64 != '' && env.ANDROID_SIGNING_KEYSTORE_PASSWORD != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: 0.2.${{ github.run_number }}
        run: |
          set -euo pipefail
          apk="apk-output/Echo-Astra-UI-Prototype.apk"
          tag_name="v${VERSION_NAME}"
          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          version_code=$((1000 + GITHUB_RUN_NUMBER))
          notes="$(printf 'Automated installable Android UI prototype build.\n\nSHA-256: %s\nVersion code: %s\nSource commit: %s' "$apk_sha256" "$version_code" "$GITHUB_SHA")"
          if gh release view "$tag_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag_name" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag_name" "$apk" --target "$GITHUB_SHA" --title "Эхо Астры ${VERSION_NAME}" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          fi
