plugins {
    id 'com.android.application'
}

def prototypeRunNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '0').toInteger()
def prototypeVersionCode = 1000 + prototypeRunNumber
def prototypeVersionName = prototypeRunNumber > 0 ? "0.2.${prototypeRunNumber}" : '0.2.0'

android {
    namespace 'com.rpggameanime.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rpggameanime.prototype'
        minSdk 24
        targetSdk 34
        versionCode prototypeVersionCode
        versionName prototypeVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Bundle the same HTML/CSS/JS files used by the live preview.
            assets.srcDirs = [
                'src/main/assets',
                "${rootProject.projectDir}/../ui-prototype"
            ]
        }
    }
}
