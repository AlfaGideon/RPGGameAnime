plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rpggameanime.prototype'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rpggameanime.prototype'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // Bundle the same HTML/CSS/JS files used by the live preview.
            assets.srcDirs = [
                'src/main/assets',
                "${rootProject.projectDir}/../ui-prototype"
            ]
        }
    }
}
